<body><main>

<header><small>光学实验台　/　GEOMETRICAL OPTICS</small><h1>透镜成像</h1><p>先固定物体的位置，换一片透镜。观察折射光线，看它们在哪里相交，或从哪里发散。</p></header>
<div id="convex-lens-lab">
  <div class="lens-selector" role="group" aria-label="透镜类型"><b>选择镜片</b><button class="btn btn-primary" data-lens="1" aria-pressed="true">凸透镜 · 会聚</button><button class="btn" data-lens="-1" aria-pressed="false">凹透镜 · 发散</button></div>

<script>
(() => {
  const root = document.getElementById('convex-lens-lab');
  if (!root) return;

  const canvas = root.querySelector('#cll-canvas');
  const ctx = canvas.getContext('2d');
  const ui = {
    zones: [...root.querySelectorAll('.cll-zone')],
    badge: root.querySelector('.cll-badge'),
    region: root.querySelector('#cll-region'),
    position: root.querySelector('#cll-position'),
    result: root.querySelector('#cll-result'),
    footnote: root.querySelector('#cll-footnote'),
    distance: root.querySelector('#cll-live-distance'),
    reset: root.querySelector('#cll-reset'),
    labels: root.querySelector('#cll-labels'),
    thirdRay: root.querySelector('#cll-third-ray')
  };

  const focusRatio = 0.105;
  const initialLensX = 0.58;
  const initialObjectX = initialLensX - 2.65 * focusRatio;
  const state = {
    sign: 1,
    lensX: initialLensX,
    objectX: initialObjectX,
    objectBaseY: 0.56,
    dragging: null,
    pointerId: null,
    grabOffsetX: 0,
    grabOffsetY: 0,
    view: { width: 0, height: 0, dpr: 1 }
  };
  const colorCache = new Map();
  const alphaCache = new Map();

  function color(name) {
    const key = `${name}:${document.documentElement.getAttribute('data-theme') || 'auto'}`;
    if (colorCache.has(key)) return colorCache.get(key);
    const probe = document.createElement('span');
    probe.style.color = `var(${name})`;
    probe.style.display = 'none';
    canvas.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    colorCache.set(key, value);
    return value;
  }

  function rgba(value, alpha) {
    const key = `${value}:${alpha}`;
    if (alphaCache.has(key)) return alphaCache.get(key);
    const nums = value.match(/[\d.]+/g);
    const result = nums && nums.length >= 3 ? `rgba(${nums[0]}, ${nums[1]}, ${nums[2]}, ${alpha})` : value;
    alphaCache.set(key, result);
    return result;
  }

  function palette() {
    return {
      fg: color('--foreground'),
      muted: color('--muted-foreground'),
      panel: color('--popover'),
      panelFg: color('--popover-foreground'),
      lens: color('--viz-series-1'),
      object: color('--viz-series-2'),
      image: color('--viz-series-3'),
      rayParallel: color('--viz-series-2'),
      rayCenter: color('--viz-series-3'),
      rayFocus: color('--viz-series-5')
    };
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(rect.width));
    const height = Math.max(1, Math.round(rect.height));
    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    state.view = { width, height, dpr };
    draw();
  }

  function scene() {
    const { width: w, height: h } = state.view;
    const axisY = h * 0.56;
    const f = w * focusRatio;
    const lensX = state.lensX * w;
    const objectX = state.objectX * w;
    const objectBaseY = state.objectBaseY * h;
    const objectTipY = objectBaseY - h * 0.13;
    const u = lensX - objectX;
    const ratio = u / f;
    const signedF = state.sign * f;
    const atFocus = state.sign === 1 && Math.abs(ratio - 1) < 1e-8;
    let v = Infinity;
    let magnification = Infinity;
    if (!atFocus) {
      v = signedF * u / (u - signedF);
      magnification = -v / u;
    }
    return {
      w, h, axisY, f, lensX, objectX, objectBaseY, objectTipY, u, ratio,
      atFocus, signedF, v, magnification, lensTop: axisY - h * 0.4, lensBottom: axisY + h * 0.4,
      imageX: atFocus ? Infinity : lensX + v,
      imageBaseY: atFocus ? Infinity : axisY + magnification * (objectBaseY - axisY),
      imageTipY: atFocus ? Infinity : axisY + magnification * (objectTipY - axisY)
    };
  }

  function classification(s) {
    const r = s.ratio;
    if (state.sign < 0) {
      return {
        key: 'diverging', region: `物距为焦距绝对值的 ${r.toFixed(2)} 倍`, position: '物体同侧，光心与焦点之间',
        result: '正立 · 缩小 · 虚像', badge: '正立 · 缩小 · 虚像',
        foot: '平行入射的光线经凹透镜折射后向外偏折。沿它反向延长，与通过光心的光线相交，就找到了虚像的顶端。'
      };
    }
    if (s.atFocus) {
      return {
        key: 'focus', region: '物体位于焦点处', position: '像在无穷远处', result: '不成清晰像', badge: '折射光线平行',
        foot: '物体位于焦点处时，折射光线彼此平行，光屏上得不到清晰的像。'
      };
    }
    if (r > 2 + 1e-8) {
      return {
        key: 'far', region: '二倍焦距以外', position: '像方 f 与 2f 之间', result: '倒立 · 缩小 · 实像', badge: '倒立 · 缩小 · 实像',
        foot: '物体位于二倍焦距以外时，像成在另一侧的一倍与二倍焦距之间。'
      };
    }
    if (r >= 2 - 1e-8) {
      return {
        key: 'two', region: '二倍焦距处', position: '像方二倍焦距处', result: '倒立 · 等大 · 实像', badge: '倒立 · 等大 · 实像',
        foot: '物体位于二倍焦距处时，像也位于另一侧二倍焦距处，物像等大。'
      };
    }
    if (r > 1) {
      return {
        key: 'middle', region: '一倍与二倍焦距之间', position: '像方二倍焦距以外', result: '倒立 · 放大 · 实像', badge: '倒立 · 放大 · 实像',
        foot: '物体位于一倍与二倍焦距之间时，像成在另一侧二倍焦距以外。'
      };
    }
    return {
      key: 'inside', region: '焦点以内', position: '物体同侧', result: '正立 · 放大 · 虚像', badge: '正立 · 放大 · 虚像',
      foot: '物体位于焦点以内时，折射光线的反向延长线相交，形成正立、放大的虚像。'
    };
  }

  function line(x1, y1, x2, y2, stroke, width = 1.5, dash = []) {
    ctx.save();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = width;
    ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function arrowhead(x1, y1, x2, y2, fill) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.save();
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 7 * Math.cos(angle - 0.42), y2 - 7 * Math.sin(angle - 0.42));
    ctx.lineTo(x2 - 7 * Math.cos(angle + 0.42), y2 - 7 * Math.sin(angle + 0.42));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function raySegment(x1, y1, x2, y2, stroke, dash = []) {
    line(x1, y1, x2, y2, stroke, 1.6, dash);
    if (!dash.length) {
      const t = 0.68;
      const ax = x1 + (x2 - x1) * t;
      const ay = y1 + (y2 - y1) * t;
      arrowhead(x1, y1, ax, ay, stroke);
    }
  }

  function roundedLabel(label, x, y, p, anchor = 'center') {
    if (!ui.labels.checked) return;
    ctx.save();
    ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = anchor;
    ctx.textBaseline = 'middle';
    const width = ctx.measureText(label).width;
    const bx = anchor === 'center' ? x - width / 2 - 6 : anchor === 'left' ? x - 6 : x - width - 6;
    ctx.fillStyle = rgba(p.panel, 0.88);
    ctx.beginPath();
    ctx.roundRect(bx, y - 11, width + 12, 22, 7);
    ctx.fill();
    ctx.fillStyle = p.panelFg;
    ctx.fillText(label, x, y);
    ctx.restore();
  }

  function drawArrowObject(x, baseY, tipY, colorValue, label, p, virtual = false) {
    const direction = tipY < baseY ? -1 : 1;
    const length = Math.abs(baseY - tipY);
    const head = Math.min(12, Math.max(3, length * 0.45));
    const foot = Math.min(15, Math.max(4, length * 0.45));
    ctx.save();
    ctx.strokeStyle = colorValue;
    ctx.fillStyle = colorValue;
    ctx.lineWidth = Math.max(2, Math.min(5, length * 0.045));
    if (virtual) ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x, tipY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x, tipY);
    ctx.lineTo(x - 0.75 * head, tipY - direction * head);
    ctx.lineTo(x + 0.75 * head, tipY - direction * head);
    ctx.closePath();
    if (virtual) {
      ctx.globalAlpha = 0.58;
      ctx.fill();
    } else {
      ctx.fill();
    }
    ctx.globalAlpha = virtual ? 0.58 : 1;
    ctx.fillRect(x - foot, baseY - 1.5, 2 * foot, 3);
    ctx.restore();
    roundedLabel(label, x, direction < 0 ? tipY - 20 : tipY + 20, p);
  }

  function drawAxisAndMarks(s, p) {
    line(18, s.axisY, s.w - 18, s.axisY, rgba(p.muted, 0.7), 1, [5, 6]);
    const marks = [
      { x: s.lensX - 2 * s.signedF, label: '2F', strong: false },
      { x: s.lensX - s.signedF, label: 'F', strong: true },
      { x: s.lensX, label: 'O', strong: true },
      { x: s.lensX + s.signedF, label: 'F′', strong: true },
      { x: s.lensX + 2 * s.signedF, label: '2F′', strong: false }
    ];
    marks.forEach(mark => {
      if (mark.x < 12 || mark.x > s.w - 12) return;
      line(mark.x, s.axisY - (mark.strong ? 8 : 6), mark.x, s.axisY + (mark.strong ? 8 : 6), mark.strong ? p.fg : p.muted, mark.strong ? 1.5 : 1);
      if (ui.labels.checked) {
        ctx.save();
        ctx.fillStyle = mark.strong ? p.fg : p.muted;
        ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(mark.label, mark.x, s.axisY + 25);
        ctx.restore();
      }
    });

    if (ui.labels.checked) {
      ctx.save();
      ctx.fillStyle = p.muted;
      ctx.font = '400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('主光轴', 24, s.axisY - 11);
      const dimY = Math.min(s.h - 20, s.axisY + 48);
      line(s.lensX, dimY, s.lensX + s.f, dimY, rgba(p.lens, 0.72), 1.2);
      line(s.lensX, dimY - 5, s.lensX, dimY + 5, rgba(p.lens, 0.72), 1.2);
      line(s.lensX + s.f, dimY - 5, s.lensX + s.f, dimY + 5, rgba(p.lens, 0.72), 1.2);
      ctx.fillStyle = p.fg;
      ctx.textAlign = 'center';
      ctx.fillText('|f|', s.lensX + s.f / 2, dimY - 7);
      ctx.restore();
    }
  }

  function drawLens(s, p) {
    const top = s.lensTop;
    const bottom = s.lensBottom;
    const halfWidth = Math.max(10, s.w * 0.011);
    const gradient = ctx.createLinearGradient(s.lensX - halfWidth, 0, s.lensX + halfWidth, 0);
    gradient.addColorStop(0, rgba(p.lens, 0.22));
    gradient.addColorStop(0.5, rgba(p.lens, 0.72));
    gradient.addColorStop(1, rgba(p.lens, 0.22));
    ctx.save();
    ctx.fillStyle = gradient;
    ctx.strokeStyle = rgba(p.lens, 0.9);
    ctx.lineWidth = 1.5;
    ctx.shadowColor = rgba(p.lens, 0.45);
    ctx.shadowBlur = 18;
    ctx.beginPath();
    if (state.sign < 0) {
      const edge = halfWidth * 1.45;
      ctx.moveTo(s.lensX-edge, top);
      ctx.lineTo(s.lensX+edge, top);
      ctx.bezierCurveTo(s.lensX+2, s.axisY-22, s.lensX+2, s.axisY+22, s.lensX+edge, bottom);
      ctx.lineTo(s.lensX-edge, bottom);
      ctx.bezierCurveTo(s.lensX-2, s.axisY+22, s.lensX-2, s.axisY-22, s.lensX-edge, top);
    } else {
      ctx.moveTo(s.lensX, top);
      ctx.bezierCurveTo(s.lensX + halfWidth * 1.7, top + s.h * 0.13, s.lensX + halfWidth * 1.7, bottom - s.h * 0.13, s.lensX, bottom);
      ctx.bezierCurveTo(s.lensX - halfWidth * 1.7, bottom - s.h * 0.13, s.lensX - halfWidth * 1.7, top + s.h * 0.13, s.lensX, top);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = p.fg;
    ctx.beginPath();
    ctx.arc(s.lensX, s.axisY, 3.5, 0, Math.PI * 2);
    ctx.fill();
    roundedLabel(state.sign > 0 ? '凸透镜' : '凹透镜', s.lensX, top - 18, p);
    roundedLabel('光心 O', s.lensX + 10, s.axisY - 18, p, 'left');
  }

  function drawSpecialRays(s, p) {
    const marginX = s.w + 24;
    const tipX = s.objectX;
    const tipY = s.objectTipY;

    const hitParallel = { x: s.lensX, y: tipY };
    const slopeParallel = (s.axisY - tipY) / s.signedF;
    const endParallel = { x: marginX, y: tipY + slopeParallel * (marginX - s.lensX) };
    raySegment(tipX, tipY, hitParallel.x, hitParallel.y, p.rayParallel);
    raySegment(hitParallel.x, hitParallel.y, endParallel.x, endParallel.y, p.rayParallel);

    const hitCenter = { x: s.lensX, y: s.axisY };
    const slopeCenter = (s.axisY - tipY) / Math.max(1, s.lensX - tipX);
    const endCenter = { x: marginX, y: s.axisY + slopeCenter * (marginX - s.lensX) };
    raySegment(tipX, tipY, hitCenter.x, hitCenter.y, p.rayCenter);
    raySegment(hitCenter.x, hitCenter.y, endCenter.x, endCenter.y, p.rayCenter);

    if (ui.thirdRay.checked && !s.atFocus) {
      const focusX = s.lensX - s.signedF;
      const slopeFocus = (s.axisY - tipY) / (focusX - tipX);
      const hitFocus = { x: s.lensX, y: tipY + slopeFocus * (s.lensX - tipX) };
      if (hitFocus.y >= s.lensTop && hitFocus.y <= s.lensBottom) {
        if (state.sign < 0) {
          raySegment(hitFocus.x, hitFocus.y, focusX, s.axisY, rgba(p.rayFocus, 0.65), [5, 5]);
        } else if (s.ratio < 1) {
          raySegment(focusX, s.axisY, tipX, tipY, rgba(p.rayFocus, 0.65), [5, 5]);
        }
        raySegment(tipX, tipY, hitFocus.x, hitFocus.y, p.rayFocus);
        raySegment(hitFocus.x, hitFocus.y, marginX, hitFocus.y, p.rayFocus);
      }
    }

    if (s.v < 0 && Number.isFinite(s.imageX)) {
      const backX = state.sign < 0 ? s.lensX - s.f : s.imageX;
      raySegment(hitParallel.x, hitParallel.y, backX, tipY + slopeParallel * (backX - s.lensX), rgba(p.rayParallel, 0.72), [6, 5]);
      // The incident central ray already passes through the virtual image of a diverging lens.
      if (s.imageX < tipX) {
        raySegment(tipX, tipY, s.imageX, s.imageTipY, rgba(p.rayCenter, 0.72), [6, 5]);
      }
    }
  }

  function drawImage(s, p) {
    const withinX = Number.isFinite(s.imageX) && s.imageX > 16 && s.imageX < s.w - 16;
    const withinY = Number.isFinite(s.imageTipY) && s.imageTipY > -s.h * 0.5 && s.imageTipY < s.h * 1.5;
    if (s.atFocus) {
      roundedLabel('像在无穷远处', s.w - 22, s.axisY - 48, p, 'right');
      return;
    }
    if (withinX && withinY) {
      drawArrowObject(s.imageX, s.imageBaseY, s.imageTipY, p.image, s.v < 0 ? '虚像' : '实像', p, s.v < 0);
      return;
    }
    if (ui.labels.checked) {
      const side = !withinX ? (s.imageX < 16 ? '画面左边' : '画面右边') : (s.imageTipY < 0 ? '画面上方' : '画面下方');
      roundedLabel(`像在${side}`, s.imageX < 0 ? 18 : s.w - 18, s.axisY - 46, p, s.imageX < 0 ? 'left' : 'right');
    }
  }

  function updateText(s, info) {
    ui.region.textContent = info.region;
    ui.position.textContent = info.position;
    ui.result.textContent = info.result;
    ui.badge.textContent = info.badge;
    ui.footnote.textContent = info.foot;
    ui.distance.textContent = `物距 ${s.ratio.toFixed(2)} |f|　·　放大率 ${s.atFocus ? '—' : s.magnification.toFixed(2)}`;
    root.querySelector('#parallel-key').textContent = state.sign > 0 ? '平行入射 → 通过远侧焦点' : '平行入射 → 反向延长线通过近侧焦点';
    root.querySelector('#focus-key').textContent = state.sign > 0 ? '经过近侧焦点或其延长线 → 平行出射' : '指向远侧焦点 → 平行出射';

    const selectedKey = info.key;
    const map = { far: '2.65', two: '2', middle: '1.5', focus: '1', inside: '0.65' };
    ui.zones.forEach(button => {
      const selected = state.sign > 0 ? button.dataset.ratio === map[selectedKey] : Math.abs(s.ratio - Number(button.dataset.ratio)) < 1e-8;
      button.classList.toggle('btn-primary', selected);
      button.setAttribute('aria-pressed', String(selected));
    });
  }

  function draw() {
    if (!state.view.width) return;
    const s = scene();
    const p = palette();
    const info = classification(s);
    ctx.clearRect(0, 0, s.w, s.h);
    drawAxisAndMarks(s, p);
    drawSpecialRays(s, p);
    drawLens(s, p);
    drawArrowObject(s.objectX, s.objectBaseY, s.objectTipY, p.object, '物体', p);
    drawImage(s, p);
    updateText(s, info);
  }

  function reset() {
    state.lensX = initialLensX;
    state.objectX = initialObjectX;
    state.objectBaseY = 0.56;
    ui.labels.checked = true;
    ui.thirdRay.checked = true;
    draw();
  }

  ui.zones.forEach(button => {
    button.addEventListener('click', () => {
      const ratio = Number(button.dataset.ratio);
      state.lensX = Math.max(state.lensX, 0.06 + ratio * focusRatio);
      state.objectX = state.lensX - ratio * focusRatio;
      draw();
    });
  });
  ui.reset.addEventListener('click', reset);
  const lenses = [...root.querySelectorAll('[data-lens]')];
  lenses.forEach(button => button.addEventListener('click', () => {
    state.sign = Number(button.dataset.lens);
    lenses.forEach(lens => {
      lens.setAttribute('aria-pressed', String(lens === button));
      lens.classList.toggle('btn-primary', lens === button);
    });
    draw();
  }));
  ui.labels.addEventListener('change', draw);
  ui.thirdRay.addEventListener('change', draw);

  function pointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) / rect.width,
      y: (event.clientY - rect.top) / rect.height
    };
  }

  canvas.addEventListener('pointerdown', event => {
    const point = pointerPosition(event);
    const s = scene();
    const px = point.x * s.w;
    const py = point.y * s.h;
    const objectNear = Math.abs(px - s.objectX) < 28 && py > Math.min(s.objectTipY, s.objectBaseY) - 24 && py < Math.max(s.objectTipY, s.objectBaseY) + 24;
    const lensNear = Math.abs(px - s.lensX) < 28 && py >= s.lensTop && py <= s.lensBottom;
    state.dragging = objectNear ? 'object' : lensNear ? 'lens' : null;
    if (!state.dragging) return;
    state.grabOffsetX = (state.dragging === 'object' ? state.objectX : state.lensX) - point.x;
    state.grabOffsetY = state.objectBaseY - point.y;
    state.pointerId = event.pointerId;
    canvas.setPointerCapture(event.pointerId);
  });

  canvas.addEventListener('pointermove', event => {
    if (!state.dragging || event.pointerId !== state.pointerId) return;
    const point = pointerPosition(event);
    if (state.dragging === 'object') {
      state.objectX = Math.max(0.055, Math.min(state.lensX - 0.045, point.x + state.grabOffsetX));
      state.objectBaseY = Math.max(0.30, Math.min(0.82, point.y + state.grabOffsetY));
    } else {
      state.lensX = Math.max(state.objectX + 0.045, Math.min(0.78, point.x + state.grabOffsetX));
    }
    draw();
  });

  function endDrag(event) {
    if (state.pointerId !== event.pointerId) return;
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    state.dragging = null;
    state.pointerId = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  const observer = new ResizeObserver(resize);
  observer.observe(canvas);
  window.addEventListener('resize', resize);
  requestAnimationFrame(resize);
})();
</script>
</main></body></html>
